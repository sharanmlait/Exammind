services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile, args: { WITH_ML: "false" } }
    env_file: backend/.env
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434   # reach Ollama running on your Mac
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["exammind-data:/app/backend/storage"]
    ports: ["8000:8000"]
  web:
    build: { context: frontend, args: { NEXT_PUBLIC_API_URL: "http://localhost:8000" } }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  exammind-data:
